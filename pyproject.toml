[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthscan"
version = "0.1.0"
description = "SynthScan - open-source, self-hostable AI-content authenticity scanner. Detects synthetic text (and, on the roadmap: images and code)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "SynthScan Contributors" }]
keywords = ["ai-detection", "content-authenticity", "writing", "education", "plagiarism", "open-source"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]

[project.optional-dependencies]
# NOTE: the real AI-text-detection Binoculars (ICML 2024, ahans30/Binoculars) is
# NOT on PyPI - the PyPI "binoculars" package is an unrelated stats library.
# So we depend on the GitHub source. This pulls Pin transformers (4.35.x) and
# Falcon-7B models; install in a dedicated env when you have >=32GB RAM/GPU.
ml = ["torch", "transformers", "binoculars @ git+https://github.com/ahans30/Binoculars.git"]
# Adds bitsandbytes so the Binoculars backend can run quantized (4bit/8bit)
# on a single 16GB GPU (Colab/Kaggle T4, P100, etc.).
ml-quantized = ["torch", "transformers", "binoculars @ git+https://github.com/ahans30/Binoculars.git", "bitsandbytes"]
api = ["fastapi", "uvicorn"]
dev = ["pytest"]
all = ["torch", "transformers", "binoculars @ git+https://github.com/ahans30/Binoculars.git", "fastapi", "uvicorn"]

[project.scripts]
synthscan = "synthscan.cli:main"

[tool.setuptools.packages.find]
include = ["synthscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "heavyml: opt-in tests that require real ML models (set SYNTHSCAN_RUN_HEAVY=1)",
]
