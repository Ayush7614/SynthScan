name: Benchmark (CPU)

# Runs the real lightweight RoBERTa model on a standard CPU runner and publishes
# the accuracy report as an artifact + PR comment. This is the default "real
# numbers" benchmark that runs on GitHub-hosted runners (no GPU needed).
#
# It intentionally does NOT run Binoculars here: that needs >=32GB RAM / a GPU.
# See .github/workflows/benchmark-binoculars.yml for the heavy workflow.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  benchmark-roberta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with ML deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ml,dev]"

      - name: Run RoBERTa benchmark
        run: |
          python scripts/benchmark_roberta.py --report benchmark-report.json

      - name: Print report
        run: |
          cat benchmark-report.json

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: roberta-benchmark-report
          path: benchmark-report.json

      - name: Post accuracy summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('benchmark-report.json')) {
              console.log('No report generated; skipping comment.');
              return;
            }
            const r = JSON.parse(fs.readFileSync('benchmark-report.json'));
            const lines = [
              `## 🤖 SynthScan benchmark (${r.backend})`,
              `**Accuracy:** ${(r.accuracy * 100).toFixed(1)}% (${r.correct}/${r.total})`,
              ``,
              `**Model:** ${r.model}`,
              `| # | Expected | Got | AI prob | OK |`,
              `|---|----------|-----|---------|----|`
            ];
            r.results.forEach((res, i) => {
              lines.push(`| ${i + 1} | ${res.expected} | ${res.verdict} | ${(res.ai_probability * 100).toFixed(0)}% | ${res.ok ? '✅' : '❌'} |`);
            });
            const body = lines.join('\n');
            if (context.payload.pull_request) {
              const { owner, repo } = context.repo;
              await github.rest.issues.createComment({
                owner, repo, issue_number: context.payload.pull_request.number, body
              });
            } else {
              console.log('Not a PR; skipping comment. Summary:\n' + body);
            }
