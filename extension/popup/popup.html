<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SynthScan</title>
  <style>
    body { width: 380px; padding: 14px; font-family: -apple-system, Segoe UI, Roboto, sans-serif; color: #111; }
    h1 { font-size: 17px; margin: 0 0 10px; }
    h1 span { color: #4a6cf7; }
    label { display: block; font-size: 12px; color: #666; margin: 10px 0 4px; }
    textarea {
      width: 100%; box-sizing: border-box; height: 90px; padding: 8px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 13px; resize: vertical;
    }
    input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 6px 8px;
      border: 1px solid #ccc; border-radius: 6px; font-size: 13px;
    }
    button {
      margin-top: 10px; width: 100%; padding: 9px; font-size: 14px; font-weight: 600;
      background: #4a6cf7; color: #fff; border: none; border-radius: 6px; cursor: pointer;
    }
    button:disabled { background: #a9b8f7; cursor: default; }
    #status { font-size: 13px; margin-top: 10px; white-space: pre-wrap; }
    .verdict { font-size: 16px; font-weight: 700; margin-top: 4px; }
    .seg { margin: 6px 0; padding: 6px; border-left: 3px solid #eee; background: #f7f7f8; border-radius: 4px; font-size: 12px; }
    .seg.ai { border-left-color: #c0392b; }
    .seg.mix { border-left-color: #e67e22; }
    .seg.hum { border-left-color: #27ae60; }
    .muted { color: #888; font-size: 11px; margin-top: 12px; }
  </style>
</head>
<body>
  <h1>Synth<span>Scan</span></h1>
  <label for="apiUrl">SynthScan server URL</label>
  <input type="text" id="apiUrl" placeholder="http://localhost:8000" />
  <label for="text">Paste text to check for AI-generated content</label>
  <textarea id="text" placeholder="Paste or type text here…"></textarea>
  <button id="scanBtn">Scan for AI</button>
  <div id="status"></div>
  <div class="muted">Open-source &amp; self-hosted. Sends text only to your configured SynthScan server.</div>

  <script src="popup.js"></script>
</body>
</html>
